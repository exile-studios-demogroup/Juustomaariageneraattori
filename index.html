<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juustomaariageneraattori</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    overflow: hidden;
    font-family: 'Arial Black', 'Arial', sans-serif;
  }
  #startScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #fff; z-index: 90; cursor: pointer;
  }
  #titleImg {
    max-width: 95%;
    max-height: 95%;
    width: auto;
    height: auto;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }
</style>
</head>
<body>

<div id="startScreen">
  <img id="titleImg" src="">
</div>

<canvas id="demoCanvas"></canvas>

<script>

const ASSET_BASE = './assets/';

const CHARACTERS = {
  al: {
    idleFrames: ['al/idle/b01.jpg', 'al/idle/b02.jpg'],
    talkFrames: ['al/talk/b01.jpg', 'al/talk/b02.jpg', 'al/talk/b03.jpg'],
    sounds: Array.from({length: 47}, (_, i) => `al/mp3s/Marko${i + 1}.mp3`),
  },
  em: {
    idleFrames: ['em/idle/b01.jpg', 'em/idle/b02.jpg'],
    talkFrames: ['em/talk/b01.jpg', 'em/talk/b02.jpg', 'em/talk/b03.jpg'],
    sounds: Array.from({length: 43}, (_, i) => `em/mp3s/Tomas${i + 1}.mp3`),
  },
};

const OUTRO_IMAGE = 'outro/endcredits1.jpg';
const TITLE_FRAMES = ['title1.jpg', 'title2.jpg'];

const GEN = {
  idleAnimSpeed: 600,
  speakAnimSpeed: 300,
};

// Conversation constants from the 2004 release. JM_* names are the originals.
// Sources: bulbengine/src/JmEnvironment.cpp:50-54 and resource/jm/timeline_jm.xml.
const JM = {
  // The idle gap between lines is bimodal: mostly a beat, occasionally a long
  // awkward silence. That distribution is the demo's comic timing.
  shortWaitProbability: 0.7, // JM_SHORT_WAIT_PROBABILITY
  shortIdle: [0.2, 1.0],     // JM_MIN/MAX_SHORT_IDLE_TIME
  longIdle: [3.0, 7.0],      // JM_MIN/MAX_LONG_IDLE_TIME
  // JmEnvironment::render() - "implement pause at the beginning"
  initialIdle: 3.0,
  // timeline_jm.xml: jmgen activates at 110.5 with setEndTime 168.0, and
  // jmoutro takes over at 170.0. So the conversation window is 57.5s, followed
  // by 2.0s in which the characters only idle.
  conversation: 57.5,
  idleTail: 2.0,
  // timeline_jm.xml: jmoutro 170.0 -> exit 175.0
  outroDuration: 5.0,
  // Mean of all 90 clips, used only when a clip's real duration is unknown.
  meanClipLength: 3.17,
  // Grace period on the talk watchdog (see talkDeadline).
  talkGrace: 1.0,
};

const canvas = document.getElementById('demoCanvas');
const ctx = canvas.getContext('2d');
let W, H;

const images = {};
const audioDurations = {};
let running = false;
let animId = null;
let currentAudio = null;
let currentSpeaker = null;
let currentAudioStartTime = 0;
let titleInterval = null;
let phase = 'show'; // show | outro | done

// Conversation state machine, mirroring JmEnvironment's JM_STATE_IDLE /
// JM_STATE_TALK. One line is decided at a time; nothing is planned ahead.
let convState = 'idle';   // idle | talk
let nextStateTime = 0;    // when the current idle ends, in demoTime
// Watchdog for the talk state. The original was purely timeout-driven
// (nextStateTime = time + SampleBank::getLength()), so it could not hang. We
// prefer the real 'ended' event for accuracy, but a media element that is
// suspended -- a hidden tab, most commonly -- fires neither 'ended' nor
// 'error', which would strand the state machine in 'talk' indefinitely.
let talkDeadline = 0;
let currentClipKey = null;

// Demo clock. Accumulated per rendered frame rather than read from
// performance.now(), so it stops when rAF stops (hidden tab, stalled machine)
// instead of racing ahead of what has actually been drawn. Long gaps are
// clamped, so a background period can never skip a phase.
const MAX_FRAME_DELTA = 0.1;
let demoTime = 0;
let lastFrameMs = 0;
// When the current phase began, in demoTime. Phase durations are measured
// against this, never against a fixed offset from the start of the demo.
let phaseStart = 0;

function setPhase(p) {
  phase = p;
  phaseStart = demoTime;
}

const playAudio = new Audio();

// Re-sync the talk animation to the moment audio actually starts, so a slow
// load does not leave the mouth flapping out of step with the voice.
playAudio.addEventListener('playing', () => {
  currentAudioStartTime = demoTime;
});
// The element's own metadata is authoritative, so use it to sharpen the
// watchdog and to warm audioDurations for the endTime guard.
playAudio.addEventListener('loadedmetadata', () => {
  if (!isFinite(playAudio.duration) || playAudio.duration <= 0) return;
  if (currentClipKey) audioDurations[currentClipKey] = playAudio.duration;
  if (convState === 'talk') {
    talkDeadline = demoTime + playAudio.duration - playAudio.currentTime + JM.talkGrace;
  }
});
// The original ended a talk state at time + SampleBank::getLength(). Driving it
// off the real 'ended' event is the same edge, without trusting metadata.
playAudio.addEventListener('ended', onLineFinished);
playAudio.addEventListener('error', onLineFinished);

function onLineFinished() {
  if (convState !== 'talk') return;
  currentAudio = null;
  currentClipKey = null;
  // No-op on the normal 'ended' path; stops a stalled clip on the watchdog
  // path, so it cannot resume later on top of the next line.
  if (!playAudio.paused) playAudio.pause();
  startIdleSequence(demoTime);
}

const rand = (min, max) => min + Math.random() * (max - min);
const randInt = (min, max) => Math.floor(rand(min, max + 1));

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => { console.warn('Image not found: ' + src); resolve(null); };
    img.src = ASSET_BASE + src;
  });
}

async function loadAllImages() {
  const allImages = [OUTRO_IMAGE, ...TITLE_FRAMES];
  for (const char of Object.values(CHARACTERS)) {
    allImages.push(...char.idleFrames, ...char.talkFrames);
  }
  await Promise.all(allImages.map(src =>
    loadImage(src).then(img => { images[src] = img; })
  ));
}

function preloadAudioDurations() {
  const TIMEOUT = 2000;
  for (const char of Object.values(CHARACTERS)) {
    for (const sound of char.sounds) {
      const audio = new Audio(ASSET_BASE + sound);
      audio.preload = 'metadata';
      const cleanup = () => clearTimeout(timer);
      const timer = setTimeout(() => {
        cleanup();
        audio.removeAttribute('src');
      }, TIMEOUT);
      audio.addEventListener('loadedmetadata', () => {
        if (audio.duration && audio.duration > 0 && isFinite(audio.duration)) {
          audioDurations[sound] = audio.duration;
        }
        cleanup();
      });
      audio.addEventListener('error', cleanup);
    }
  }
}

function stopAllSounds() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
}

// Get duration for a sound file (preloaded) or a safe fallback. Only used to
// decide whether a line still fits inside the conversation window.
function getDuration(soundKey) {
  return audioDurations[soundKey] || JM.meanClipLength;
}

// JmEnvironment::startIdleSequence - both characters just stare at each other.
function startIdleSequence(now) {
  convState = 'idle';
  currentSpeaker = null;
  const [lo, hi] = Math.random() < JM.shortWaitProbability ? JM.shortIdle : JM.longIdle;
  nextStateTime = now + rand(lo, hi);
}

// JmEnvironment::startTalkSequence - one character says one line.
function startTalkSequence(now) {
  // rand() % 2, drawn fresh each line: the same character often speaks twice
  // or more in a row. This is not turn-taking.
  const speaker = Math.random() < 0.5 ? 'em' : 'al';
  const sounds = CHARACTERS[speaker].sounds;
  // rand() % size, uniform over the whole bank, repeats allowed.
  const soundKey = sounds[randInt(0, sounds.length - 1)];

  // The endTime guard: start a line only if it finishes inside the window,
  // otherwise idle again. A line is never cut off mid-word.
  if (now + getDuration(soundKey) > JM.conversation) {
    startIdleSequence(now);
    return;
  }

  convState = 'talk';
  currentSpeaker = speaker;
  currentAudioStartTime = now;
  currentAudio = playAudio;
  currentClipKey = soundKey;
  talkDeadline = now + getDuration(soundKey) + JM.talkGrace;
  playAudio.src = ASSET_BASE + soundKey;
  playAudio.play().catch(onLineFinished);
}

function render() {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const gap = Math.max(20, Math.round(W * 0.04));
  const marginX = Math.round(W * 0.05);
  const marginY = Math.round(H * 0.08);
  const baseY = H - marginY;

  const emRef = images['em/idle/b01.jpg'];
  const alRef = images['al/idle/b01.jpg'];
  const emW = emRef?.width ?? 0;
  const emH = emRef?.height ?? 0;
  const alW = alRef?.width ?? 0;
  const alH = alRef?.height ?? 0;

  let scale = 1;
  if (emW + alW > 0) {
    const maxScaleW = (W - gap - 2 * marginX) / (emW + alW);
    const maxScaleH = (H - 2 * marginY) / Math.max(emH, alH, 1);
    scale = Math.min(1, maxScaleW, maxScaleH);
  }
  const baseX = (W - ((emW + alW) * scale + gap)) / 2;

  const now = demoTime;

  for (const key of ['em', 'al']) {
    const charDef = CHARACTERS[key];
    // currentSpeaker is the equivalent of the original's emAnimation /
    // alAnimation pair: exactly one character talks, the other idles.
    const speaking = currentSpeaker === key;
    const t = speaking ? now - currentAudioStartTime : now;
    const phase = Math.floor(t / (speaking ? GEN.speakAnimSpeed : GEN.idleAnimSpeed) * 1000);
    const frames = speaking ? charDef.talkFrames : charDef.idleFrames;
    const frameSrc = frames[phase % frames.length];

    const img = images[frameSrc];
    if (!img) continue;

    const w = img.width * scale;
    const h = img.height * scale;
    const drawX = key === 'em' ? baseX : baseX + emW * scale + gap;
    ctx.drawImage(img, drawX, baseY - h, w, h);
  }
}

function showStartScreen() {
  document.getElementById('startScreen').style.display = 'flex';
  document.body.style.cursor = 'default';
  let frame = 0;
  const img = document.getElementById('titleImg');
  img.src = ASSET_BASE + TITLE_FRAMES[0];
  titleInterval = setInterval(() => {
    frame = (frame + 1) % TITLE_FRAMES.length;
    img.src = ASSET_BASE + TITLE_FRAMES[frame];
  }, GEN.idleAnimSpeed);
}

function renderOutro() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  const img = images[OUTRO_IMAGE];
  if (img) {
    const marginX = Math.round(W * 0.05);
    const marginY = Math.round(H * 0.08);
    const scale = Math.min(1, (W - 2 * marginX) / img.width, (H - 2 * marginY) / img.height);
    const w = img.width * scale;
    const h = img.height * scale;
    ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  }
}

function loop() {
  if (phase === 'done') return;

  const nowMs = performance.now();
  demoTime += Math.min((nowMs - lastFrameMs) / 1000, MAX_FRAME_DELTA);
  lastFrameMs = nowMs;

  // One transition per frame: each phase gets at least one drawn frame, and
  // its length is measured from when it actually began.
  if (phase === 'show') {
    // JmEnvironment::render() polls the state machine once per frame. The
    // talk -> idle edge is driven by the audio's 'ended' event instead.
    if (convState === 'idle' && demoTime > nextStateTime) {
      startTalkSequence(demoTime);
    } else if (convState === 'talk' && demoTime > talkDeadline) {
      onLineFinished();
    }
    render();
    // The scene switch is at a fixed time, as in the timeline. After
    // JM.conversation no new line starts, so this tail is idling only.
    if (demoTime >= JM.conversation + JM.idleTail) {
      stopAllSounds();
      setPhase('outro');
    }
  } else if (phase === 'outro') {
    renderOutro();
    if (demoTime - phaseStart >= JM.outroDuration) {
      phase = 'done';
      stopAllSounds();
      showStartScreen();
      return;
    }
  }

  animId = requestAnimationFrame(loop);
}

function startDemo() {
  if (animId) cancelAnimationFrame(animId);
  stopAllSounds();
  if (titleInterval) { clearInterval(titleInterval); titleInterval = null; }

  document.getElementById('startScreen').style.display = 'none';
  document.body.style.cursor = 'none';

  preloadAudioDurations();

  demoTime = 0;
  lastFrameMs = performance.now();
  setPhase('show');
  running = true;

  // JmEnvironment::render(): "implement pause at the beginning". Both
  // characters idle for 3s before anyone says anything.
  convState = 'idle';
  currentSpeaker = null;
  currentClipKey = null;
  nextStateTime = JM.initialIdle;

  animId = requestAnimationFrame(loop);
}

function stopDemo() {
  phase = 'done';
  convState = 'idle';
  currentSpeaker = null;
  currentClipKey = null;
  running = false;
  if (animId) cancelAnimationFrame(animId);
  stopAllSounds();
  if (titleInterval) { clearInterval(titleInterval); titleInterval = null; }
  showStartScreen();
}

async function init() {
  await loadAllImages();
  preloadAudioDurations();
  showStartScreen();
  document.getElementById('startScreen').addEventListener('click', () => startDemo());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') stopDemo();
    if ((e.key === ' ' || e.key === 'Enter') && !running) startDemo();
    if (e.key === 'f' || e.key === 'F') {
      document.fullscreenElement
        ? document.exitFullscreen()
        : document.documentElement.requestFullscreen().catch(() => {});
    }
  });
}

init();
</script>
</body>
</html>
